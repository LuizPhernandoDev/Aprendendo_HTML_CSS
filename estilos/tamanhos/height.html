<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamanhos</title>
    <style>
        h1{
            background-color: blue;
            height: 200px;
        }
        /*
        define a altura da área de conteúdo de um elemento. Por padrão, ela não inclui preenchimentos (padding), bordas (border) ou margens (margin), a menos que você altere o comportamento do Box Model usando box-sizing: border-box
        
        valores aceitos:
        auto: O elemento expande ou encolhe para se ajustar perfeitamente ao seu conteúdo interno.
        Fixo (px, rem, em): Define um tamanho rígido que não muda de acordo com o conteúdo ou o tamanho da tela.
        Porcentagem (%): O elemento assume uma fração da altura do seu elemento pai. Se o pai não tiver altura definida, o valor falha e age como auto.
        Viewport (vh): Baseia-se na altura da janela do navegador. 100vh preenche toda a altura da tela visible.
        */
    </style>
</head>
<body>
    <h1>Hello world!</h1>
</body>
</html>
