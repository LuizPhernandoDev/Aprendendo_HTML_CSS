<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos em HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Esse vídeo está hospedados no meu próprio servidor.</p>
    <video src="midia/paris.mp4" width="560" poster="imagens/capa-video.png" controls></video>
    <!--pode funcionar mas não é recomendado-->
    <br>
    <video width="560" poster="imagens/capa-video.png" controls autoplay loop muted>
        <source src="midia/Paris.m4v" type="video/m4v">   <!--Mais recomendado-->
        <source src="midia/Paris.webm" type="video/webm"> <!--Mais recomendado-->
        <source src="midia/Paris.mkv" type="video/mkv">   <!--Mais recomendado-->
        <source src="midia/paris.mp4" type="video/mp4">
        <source src="midia/Paris.ogv" type="video/ogg"> <!--incompatível com a maioria dos navegadores modernos-->
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>
    </video>
    <!--width: vai indicar a largura que o vídeo vai ter na tela. Nesse exemplo, 600px-->
    <!--poster: configura uma imagem que vai aparecer como uma capa, enquanto o visitante não aperta o play para reproduzir o vídeo-->
    <!--controls: vai configurar se os controles do vídeo vão aparecer na parte inferior da mídia. Por padrão, os controles não aparecerão, mas basta colocar a palavra controls na tag <video>-->
    <!--autoplay: diz para o navegador se o vídeo vai começar a tocar automaticamente, assim que a página for carregada-->
    <!--
        Navegador       Arquivos compatíveis
        Microsoft Edge   .mp4 .m4v
        Apple Safari     .mp4 .m4v
        Google Chrome    .mp4 .m4v .webm .ogv
        Mozilla Firefox  .webm .ogv
        Opera            .webm .ogv
    -->
    <!--não é recomendado usar vidios de hospedagem localmente-->

    <h1>Inserindo videos do YouTube</h1>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/aToV661mADA?si=GCIeUAXCpUw5so95" title="Meu video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <br>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/7j60jaMapJ0?si=ELDRySlRauYFotg6" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <!--deve ser usado um servidor para ser visivel, pois o youtube bloqueia-->

    <h1>Inserindo videos do Vimeo</h1>
    
    <iframe src="https://player.vimeo.com/video/94702458?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" width="560" height="315" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" title="Rambo Estrada"></iframe>
</body>
</html>
