<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamanhos</title>
    <style>
        h1{
            background-color: blue;
            max-width: 600px;
        }
        /*
        define a largura máxima que um elemento pode alcançar no eixo horizontal. Ela funciona como um "teto" ou limite de segurança: o elemento pode encolher livremente se a tela for pequena, mas nunca passará do tamanho estipulado, não importa quão grande seja o monitor.

        Em telas grandes (Computador): A caixa trava em 600px de largura e para de esticar, mantendo o texto centralizado e elegante.
        Em telas pequenas (Celular): A caixa ignora os 600px e encolhe automaticamente, adaptando-se perfeitamente à largura da tela do celular para não gerar barras de rolagem horizontais.

        valores aceitos:
        auto: O valor padrão. O navegador calcula a altura automaticamente com base no conteúdo interno.
        fit-content: Ajusta a altura exatamente ao tamanho do conteúdo, respeitando o espaço disponível.
        max-content: Força a altura ideal para o conteúdo caber sem nenhuma quebra de linha ou restrição (mesmo que transborde o elemento pai).
        min-content: Define a altura com base no menor tamanho possível que o conteúdo exige (por exemplo, a maior palavra ou o menor elemento interno).
        Pixels (px): Unidade estática comum (ex: height: 250px;).
        Relativos à fonte (em, rem): Escala com o tamanho do texto (ex: height: 15rem;).
        Relativos à tela do usuário (Viewport):
            vh / vw: Porcentagem da altura/largura total da janela (ex: height: 100vh; ocupa a tela inteira).
            lvh / svh / dvh: Variações modernas para lidar com barras de navegação dinâmicas em celulares (Large, Small e Dynamic Viewport Height).
        %: Define a altura como uma porcentagem da altura do elemento pai.
	        Nota importante: Para funcionar, o elemento pai precisa ter uma altura explicitamente definida (em px, vh, etc.), caso contrário, o valor padrão auto será aplicado.
        inherit: Herda o valor de altura do elemento pai.
        initial: Define a altura para o seu valor padrão de fábrica do CSS (auto).
        revert: Reseta a altura para o comportamento padrão do navegador (User Agent).
        unset: Combina inherit ou initial dependendo se a propriedade é herdada naturalmente ou não (no caso de height, age como initial).
        */
    </style>
</head>
<body>
    <h1>Hello world!</h1>
</body>
</html>
