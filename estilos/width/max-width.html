<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamanhos</title>
    <style>
        h1{
            background-color: blue;
            max-width: 600px;
        }
        /*
        define a largura máxima que um elemento pode alcançar no eixo horizontal. Ela funciona como um "teto" ou limite de segurança: o elemento pode encolher livremente se a tela for pequena, mas nunca passará do tamanho estipulado, não importa quão grande seja o monitor.

        Em telas grandes (Computador): A caixa trava em 600px de largura e para de esticar, mantendo o texto centralizado e elegante.
        Em telas pequenas (Celular): A caixa ignora os 600px e encolhe automaticamente, adaptando-se perfeitamente à largura da tela do celular para não gerar barras de rolagem horizontais.

        valores aceitos:
        auto: O elemento expande ou encolhe para se ajustar perfeitamente ao seu conteúdo interno.
        Fixo (px, rem, em): Define um tamanho rígido que não muda de acordo com o conteúdo ou o tamanho da tela.
        Porcentagem (%): O elemento assume uma fração da altura do seu elemento pai. Se o pai não tiver altura definida, o valor falha e age como auto.
        Viewport (vh): Baseia-se na altura da janela do navegador. 100vh preenche toda a altura da tela visible.
        */
    </style>
</head>
<body>
    <h1>Hello world!</h1>
</body>
</html>
